# DefSeg-AM v2 — 8-class + DSCNN aug + 8-fold cross-validation
#
# 사용 예 (.env 또는 인라인 환경변수):
#
#   cd DefSeg_AM/v2/docker
#
#   # 1) 캐시 빌드 (label 재매핑, ~5분)
#   DEFSEG_PHASE=build_cache docker compose up -d --build
#   docker compose logs -f
#
#   # 2) Stage 1 학습 (~12h)
#   DEFSEG_PHASE=stage1 docker compose up -d --build
#
#   # 2-1) Stage 1 with hard-bootstrap
#   DEFSEG_PHASE=stage1 DEFSEG_EXTRA=--use-hard-bootstrap docker compose up -d --build
#
#   # 3) Stage 2 — 단일 fold
#   DEFSEG_PHASE=stage2 DEFSEG_FOLD=0 docker compose up -d --build
#
#   # 3') Stage 2 — 8 fold 전체 순회
#   DEFSEG_PHASE=stage2 DEFSEG_FOLD=all docker compose up -d --build
#
#   # 4) 전체 파이프라인
#   DEFSEG_PHASE=all docker compose up -d --build
#
# GPU 선택:
#   NVIDIA_VISIBLE_DEVICES=2 docker compose up -d --build
#
services:
  defseg-am-v2:
    build:
      context: ../../..       # repo root
      dockerfile: DefSeg_AM/v2/docker/Dockerfile
    image: defseg-am-v2:gpu
    runtime: nvidia
    user: "${UID_GID:-1000:1000}"
    restart: "no"
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-0}
      - PYTHONPATH=/workspace
      - HOME=/tmp
      - HDF5_USE_FILE_LOCKING=FALSE
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-8}
      # 실행 제어
      - DEFSEG_PHASE=${DEFSEG_PHASE:-stage1}        # build_cache|stage1|stage2|infer|all
      - DEFSEG_FOLD=${DEFSEG_FOLD:-0}                # 0..7 또는 'all' (stage2 시)
      - DEFSEG_EXTRA=${DEFSEG_EXTRA:-}               # e.g. "--use-hard-bootstrap --quick"
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      # host venv (DefSeg_AM/venv) - read-only
      - ../../venv:/workspace/DefSeg_AM/venv:ro
      # ORNL_Data (원본 HDF5 + DSCNN_Dataset) - read-only
      - ../../../ORNL_Data:/workspace/ORNL_Data:ro
      # DefSeg_AM 소스 + 산출물 (cache, checkpoints, figures, logs) - rw
      # 호스트와 동일 경로 (/workspace/DefSeg_AM) 로 두어 PYTHONPATH 단순화
      - ../..:/workspace/DefSeg_AM:rw
    shm_size: "4gb"
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        set -e
        VENV_PY=/workspace/DefSeg_AM/venv/bin/python
        # ── 사전 검증 ──
        if [ ! -x "$$VENV_PY" ]; then
          echo "[v2] FATAL: $$VENV_PY 없음 — host venv 마운트 확인" >&2
          exit 1
        fi
        if [ ! -d /workspace/ORNL_Data ]; then
          echo "[v2] FATAL: ORNL_Data 마운트 실패" >&2; exit 1
        fi
        OUT=/workspace/DefSeg_AM
        if ! touch "$$OUT/.v2_write_test" 2>/dev/null; then
          echo "[v2] FATAL: $$OUT 쓰기 실패 — UID/권한 확인" >&2; exit 1
        fi
        rm -f "$$OUT/.v2_write_test"

        $$VENV_PY -c "import torch,sys; print(f'[v2] python={sys.version.split()[0]} torch={torch.__version__} cuda={torch.cuda.is_available()} devs={torch.cuda.device_count()}')"

        echo "[v2] phase=$${DEFSEG_PHASE} fold=$${DEFSEG_FOLD} extra=$${DEFSEG_EXTRA}"

        run_build_cache() {
          $$VENV_PY -u -m DefSeg_AM.v2.data.build_cache_v2 --img-size 1036 $${DEFSEG_EXTRA}
        }
        run_stage1() {
          $$VENV_PY -u -m DefSeg_AM.v2.training.train_stage1 \
            --epochs 30 --batch-size 2 --img-size 1036 \
            --backbone dinov2_vits14 --num-workers 8 \
            --gamma 2.0 --oversample-power 0.5 --val-log-every 100 \
            --run-name vits14_dpt_dual_sz1036_8cls_v2 \
            $${DEFSEG_EXTRA}
        }
        run_stage2_one() {
          F=$$1
          echo "[v2] stage2 fold=$$F"
          $$VENV_PY -u -m DefSeg_AM.v2.training.train_stage2 \
            --fold $$F \
            --epochs 50 --batch-size 2 --img-size 1036 \
            --backbone dinov2_vits14 --num-workers 4 \
            --val-log-every 10 \
            --run-name vits14_dpt_dual_sz1036_8cls_v2 \
            $${DEFSEG_EXTRA}
        }
        run_stage2_all() {
          for F in 0 1 2 3 4 5 6 7; do
            run_stage2_one $$F
          done
        }

        case "$${DEFSEG_PHASE}" in
          build_cache)
            run_build_cache
            ;;
          stage1)
            run_stage1
            ;;
          stage2)
            if [ "$${DEFSEG_FOLD}" = "all" ]; then
              run_stage2_all
            else
              run_stage2_one $${DEFSEG_FOLD}
            fi
            ;;
          all)
            run_build_cache
            run_stage1
            run_stage2_all
            ;;
          infer)
            # 단순 sanity infer (사용자 정의 옵션 필요 시 docker exec 로 직접)
            $$VENV_PY -u -m DefSeg_AM.v2.inference.infer \
              --run-name vits14_dpt_dual_sz1036_8cls_v2 \
              --stage 2 --ensemble --tta $${DEFSEG_EXTRA}
            ;;
          *)
            echo "[v2] FATAL: unknown DEFSEG_PHASE=$${DEFSEG_PHASE}" >&2
            exit 1
            ;;
        esac
        echo "[v2] phase=$${DEFSEG_PHASE} done."
